<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Application Form</title>


    <style>

        /* =========================
           BODY
        ========================= */

        body {

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #141E30,
                #243B55
            );

            margin: 0;

            padding: 30px;

            min-height: 100vh;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 75%;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.3);
        }


        /* =========================
           HEADING
        ========================= */

        h1 {

            text-align: center;

            color: #6C63FF;

            font-size: 35px;

            margin-bottom: 10px;
        }


        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }


        /* =========================
           FORM SECTION
        ========================= */

        .section {

            background: #F8F7FF;

            padding: 20px;

            margin-bottom: 20px;

            border-radius: 15px;

            border-left: 6px solid #6C63FF;
        }


        .section-title {

            color: #6C63FF;

            margin-bottom: 20px;

            font-size: 20px;
        }


        /* =========================
           FORM ROW
        ========================= */

        .form-row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-bottom: 18px;
        }


        /* =========================
           FORM GROUP
        ========================= */

        .form-group {

            display: flex;

            flex-direction: column;
        }


        label {

            font-weight: bold;

            color: #333;

            margin-bottom: 7px;
        }


        /* =========================
           INPUTS
        ========================= */

        input,
        select,
        textarea {

            padding: 12px;

            border: 2px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #6C63FF;

            box-shadow:
                0 0 7px rgba(108, 99, 255, 0.25);
        }


        textarea {

            resize: vertical;

            min-height: 90px;
        }


        /* =========================
           GENDER
        ========================= */

        .gender {

            display: flex;

            gap: 20px;

            margin-top: 10px;
        }


        .gender label {

            font-weight: normal;

            display: flex;

            align-items: center;

            gap: 5px;
        }


        .gender input {

            width: auto;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {

            text-align: center;

            margin-top: 25px;
        }


        button {

            padding: 13px 30px;

            margin: 5px;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .submit-btn {

            background: linear-gradient(
                135deg,
                #6C63FF,
                #8E54E9
            );

            color: white;
        }


        .submit-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 5px 15px rgba(108, 99, 255, 0.4);
        }


        .reset-btn {

            background: #ddd;

            color: #333;
        }


        .reset-btn:hover {

            background: #bbb;
        }


        /* =========================
           RESULT
        ========================= */

        #result {

            margin-top: 25px;

            padding: 20px;

            background: #E8F5E9;

            border: 2px solid #4CAF50;

            border-radius: 12px;

            display: none;
        }


        #result h2 {

            color: #2E7D32;

            margin-top: 0;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            body {

                padding: 15px;
            }


            .container {

                width: 90%;

                padding: 20px;
            }


            .form-row {

                grid-template-columns: 1fr;
            }


            h1 {

                font-size: 28px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================
         TITLE
    ========================= -->

    <h1>
        🎓 Student Application Form
    </h1>


    <p class="subtitle">
        Please fill in your details to submit your application
    </p>


    <form onsubmit="submitApplication(event)">


        <!-- =========================
             PERSONAL INFORMATION
        ========================= -->

        <div class="section">

            <h2 class="section-title">
                👤 Personal Information
            </h2>


            <div class="form-row">


                <div class="form-group">

                    <label for="firstName">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter first name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="lastName">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter last name"
                        required
                    >

                </div>

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label for="dob">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dob"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Gender
                    </label>

                    <div class="gender">

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                                required
                            >
                            Male
                        </label>


                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                            >
                            Female
                        </label>


                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Other"
                            >
                            Other
                        </label>

                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             ACADEMIC INFORMATION
        ========================= -->

        <div class="section">

            <h2 class="section-title">
                📚 Academic Information
            </h2>


            <div class="form-row">


                <div class="form-group">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter student ID"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <select id="course" required>

                        <option value="">
                            Select Course
                        </option>

                        <option>
                            B.E Computer Science
                        </option>

                        <option>
                            B.Tech Information Technology
                        </option>

                        <option>
                            B.E Electronics
                        </option>

                        <option>
                            B.E Mechanical
                        </option>

                        <option>
                            B.E Civil
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label for="year">
                        Year of Study
                    </label>

                    <select id="year" required>

                        <option value="">
                            Select Year
                        </option>

                        <option>
                            1st Year
                        </option>

                        <option>
                            2nd Year
                        </option>

                        <option>
                            3rd Year
                        </option>

                        <option>
                            4th Year
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="cgpa">
                        CGPA
                    </label>

                    <input
                        type="number"
                        id="cgpa"
                        min="0"
                        max="10"
                        step="0.01"
                        placeholder="Enter CGPA"
                        required
                    >

                </div>

            </div>

        </div>


        <!-- =========================
             CONTACT INFORMATION
        ========================= -->

        <div class="section">

            <h2 class="section-title">
                📞 Contact Information
            </h2>


            <div class="form-row">


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter 10 digit number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="address">
                    🏠 Address
                </label>

                <textarea
                    id="address"
                    placeholder="Enter your address"
                    required
                ></textarea>

            </div>

        </div>


        <!-- =========================
             APPLICATION DETAILS
        ========================= -->

        <div class="section">

            <h2 class="section-title">
                📝 Application Details
            </h2>


            <div class="form-group">

                <label for="reason">
                    Why do you want to join this course?
                </label>

                <textarea
                    id="reason"
                    placeholder="Enter your reason"
                    required
                ></textarea>

            </div>

        </div>


        <!-- =========================
             BUTTONS
        ========================= -->

        <div class="buttons">

            <button
                type="submit"
                class="submit-btn">

                🚀 Submit Application

            </button>


            <button
                type="reset"
                class="reset-btn">

                🔄 Reset

            </button>

        </div>


    </form>


    <!-- =========================
         RESULT
    ========================= -->

    <div id="result">

        <h2>
            ✅ Application Submitted!
        </h2>

        <p id="resultText"></p>

    </div>


</div>


<script>


function submitApplication(event) {


    /* Stop page refresh */

    event.preventDefault();


    /* Get Student Name */

    var firstName =
        document.getElementById("firstName").value;


    var lastName =
        document.getElementById("lastName").value;


    /* Display Result */

    document.getElementById("resultText").innerHTML =

        "Welcome <b>" +
        firstName +
        " " +
        lastName +
        "</b>!<br><br>" +

        "Your student application has been submitted successfully.";


    /* Show Result */

    document.getElementById("result").style.display =
        "block";


    /* Scroll to Result */

    document.getElementById("result")
        .scrollIntoView({
            behavior: "smooth"
        });

}

</script>


</body>

</html>
