<!DOCTYPE html>
<html lang="en">

<head>

    <!-- HTML5 -->
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Simple Calculator</title>


    <!-- CSS / CSS3 -->
    <style>

        /* Remove default spacing */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        /* Page background */

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: linear-gradient(
                135deg,
                #141e30,
                #243b55
            );

        }


        /* Calculator */

        .calculator {

            width: 350px;

            padding: 20px;

            background: #222;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.5);

        }


        /* Title */

        .calculator h1 {

            color: white;

            text-align: center;

            margin-bottom: 15px;

            font-size: 25px;

        }


        /* Display */

        #display {

            width: 100%;

            height: 70px;

            margin-bottom: 15px;

            padding: 10px;

            border: none;

            border-radius: 10px;

            background: #eeeeee;

            color: #111;

            font-size: 30px;

            text-align: right;

            outline: none;

        }


        /* Button container */

        .buttons {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

        }


        /* Buttons */

        button {

            height: 60px;

            border: none;

            border-radius: 12px;

            font-size: 20px;

            cursor: pointer;

            background: #444;

            color: white;

            transition: 0.2s;

        }


        /* Button hover */

        button:hover {

            background: #666;

            transform: scale(1.03);

        }


        /* Operator buttons */

        .operator {

            background: #ff9500;

        }


        .operator:hover {

            background: #ffad33;

        }


        /* Clear button */

        .clear {

            background: #e74c3c;

        }


        .clear:hover {

            background: #ff6655;

        }


        /* Equal button */

        .equal {

            background: #27ae60;

        }


        .equal:hover {

            background: #35c978;

        }


        /* Zero button */

        .zero {

            grid-column: span 2;

        }


        /* Responsive design */

        @media (max-width: 400px) {

            .calculator {

                width: 90%;

            }

            button {

                height: 55px;

            }

            #display {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


    <!-- Calculator -->

    <div class="calculator">


        <h1>🧮 Calculator</h1>


        <!-- Display -->

        <input
            type="text"
            id="display"
            value="0"
            readonly>


        <!-- Buttons -->

        <div class="buttons">


            <!-- First row -->

            <button
                class="clear"
                onclick="clearDisplay()">

                AC

            </button>


            <button
                onclick="deleteNumber()">

                DEL

            </button>


            <button
                class="operator"
                onclick="percentage()">

                %

            </button>


            <button
                class="operator"
                onclick="addOperator('/')">

                ÷

            </button>


            <!-- Second row -->

            <button
                onclick="addNumber('7')">

                7

            </button>


            <button
                onclick="addNumber('8')">

                8

            </button>


            <button
                onclick="addNumber('9')">

                9

            </button>


            <button
                class="operator"
                onclick="addOperator('*')">

                ×

            </button>


            <!-- Third row -->

            <button
                onclick="addNumber('4')">

                4

            </button>


            <button
                onclick="addNumber('5')">

                5

            </button>


            <button
                onclick="addNumber('6')">

                6

            </button>


            <button
                class="operator"
                onclick="addOperator('-')">

                −

            </button>


            <!-- Fourth row -->

            <button
                onclick="addNumber('1')">

                1

            </button>


            <button
                onclick="addNumber('2')">

                2

            </button>


            <button
                onclick="addNumber('3')">

                3

            </button>


            <button
                class="operator"
                onclick="addOperator('+')">

                +

            </button>


            <!-- Fifth row -->

            <button
                class="zero"
                onclick="addNumber('0')">

                0

            </button>


            <button
                onclick="addNumber('.')">

                .

            </button>


            <button
                class="equal"
                onclick="calculate()">

                =

            </button>


        </div>

    </div>


    <!-- JavaScript -->

    <script>


        /* Get display */

        let display =
            document.getElementById("display");


        /* Add number */

        function addNumber(number) {

            if (display.value === "0") {

                display.value = number;

            }

            else {

                display.value += number;

            }

        }


        /* Add operator */

        function addOperator(operator) {

            let lastCharacter =
                display.value.slice(-1);


            /*
             Prevent multiple operators
            */

            if (
                lastCharacter === "+" ||
                lastCharacter === "-" ||
                lastCharacter === "*" ||
                lastCharacter === "/"
            ) {

                return;

            }


            display.value += operator;

        }


        /* Clear display */

        function clearDisplay() {

            display.value = "0";

        }


        /* Delete last character */

        function deleteNumber() {

            if (display.value.length === 1) {

                display.value = "0";

            }

            else {

                display.value =
                    display.value.slice(0, -1);

            }

        }


        /* Percentage */

        function percentage() {

            try {

                let value =
                    parseFloat(display.value);

                display.value =
                    value / 100;

            }

            catch {

                display.value = "Error";

            }

        }


        /* Calculate */

        function calculate() {

            try {

                let expression =
                    display.value;


                /*
                 Evaluate mathematical expression
                */

                let result =
                    eval(expression);


                display.value = result;

            }

            catch {

                display.value = "Error";

            }

        }


        /* Keyboard support */

        document.addEventListener(
            "keydown",
            function(event) {


                if (
                    event.key >= "0" &&
                    event.key <= "9"
                ) {

                    addNumber(event.key);

                }


                else if (
                    event.key === "+" ||
                    event.key === "-" ||
                    event.key === "*" ||
                    event.key === "/"
                ) {

                    addOperator(event.key);

                }


                else if (event.key === ".") {

                    addNumber(".");

                }


                else if (event.key === "Enter") {

                    calculate();

                }


                else if (event.key === "Backspace") {

                    deleteNumber();

                }


                else if (event.key === "Escape") {

                    clearDisplay();

                }

            }
        );

    </script>


</body>

</html>
