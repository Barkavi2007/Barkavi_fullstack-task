<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <style>

        /* CSS3 Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body */
        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        /* Login Box */
        .login-container {
            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);
        }

        /* Logo */
        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #667eea;

            color: white;

            font-size: 32px;
        }

        /* Heading */
        h1 {
            text-align: center;

            color: #333;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        /* Input Group */
        .input-group {
            margin-bottom: 20px;
        }

        /* Labels */
        label {
            display: block;

            color: #333;

            font-weight: bold;

            margin-bottom: 8px;
        }

        /* Input Fields */
        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        /* Focus Effect */
        input:focus {
            border-color: #667eea;

            box-shadow:
                0 0 6px rgba(102, 126, 234, 0.4);
        }

        /* Password Box */
        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        /* Show Password */
        .show-password {
            position: absolute;

            right: 12px;

            top: 13px;

            color: #667eea;

            font-size: 13px;

            cursor: pointer;

            font-weight: bold;
        }

        /* Options */
        .options {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

            font-size: 14px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 6px;
        }

        .remember input {
            width: auto;
        }

        /* Forgot Password */
        .forgot {
            color: #667eea;

            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* Login Button */
        .login-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #667eea;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            background: #4c5fd5;

            transform: translateY(-2px);
        }

        /* Register */
        .register {
            text-align: center;

            margin-top: 22px;

            color: #666;

            font-size: 14px;
        }

        .register a {
            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            text-align: center;

            margin-top: 25px;

            color: #999;

            font-size: 12px;
        }

        /* Mobile Responsive */
        @media (max-width: 450px) {

            .login-container {
                width: 90%;

                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- Student Logo -->

        <div class="logo">
            🎓
        </div>


        <!-- Heading -->

        <h1>Student Login</h1>

        <p class="subtitle">
            Login to access your student portal
        </p>


        <!-- Login Form -->

        <form onsubmit="studentLogin(event)">


            <!-- Student ID -->

            <div class="input-group">

                <label for="studentId">
                    Student ID / Email
                </label>

                <input
                    type="text"
                    id="studentId"
                    name="studentId"
                    placeholder="Enter Student ID or Email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        minlength="6"
                        required
                    >

                    <span
                        class="show-password"
                        onclick="togglePassword()">
                        Show
                    </span>

                </div>

            </div>


            <!-- Remember & Forgot -->

            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        name="remember"
                    >

                    Remember me

                </label>


                <a href="#" class="forgot">
                    Forgot Password?
                </a>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-btn">

                Login

            </button>


        </form>


        <!-- Registration -->

        <div class="register">

            New student?

            <a href="#">
                Register Here
            </a>

        </div>


        <!-- Footer -->

        <div class="footer">

            © 2026 Student Portal

        </div>


    </div>


    <script>

        // Show / Hide Password

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".show-password");


            if (password.type === "password") {

                password.type = "text";

                button.innerText = "Hide";

            } else {

                password.type = "password";

                button.innerText = "Show";

            }

        }


        // Login Function

        function studentLogin(event) {

            event.preventDefault();


            const studentId =
                document.getElementById("studentId").value;


            alert(
                "Login Successful!\n\n" +
                "Welcome, " +
                studentId
            );

        }

    </script>


</body>

</html>
