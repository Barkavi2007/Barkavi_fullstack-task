<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body */
        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        /* Main Container */
        .container {
            width: 850px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);
        }

        /* Heading */
        h1 {
            text-align: center;

            color: #333;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        /* Section Heading */
        .section-title {
            color: #667eea;

            font-size: 20px;

            margin: 25px 0 15px;

            border-bottom: 2px solid #667eea;

            padding-bottom: 8px;
        }

        /* Form Grid */
        .form-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-bottom: 18px;
        }

        /* Form Group */
        .form-group {
            display: flex;

            flex-direction: column;
        }

        /* Labels */
        label {
            font-weight: bold;

            color: #333;

            margin-bottom: 7px;
        }

        /* Inputs */
        input,
        select,
        textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        /* Focus Effect */
        input:focus,
        select:focus,
        textarea:focus {
            border-color: #667eea;

            box-shadow:
                0 0 5px rgba(102, 126, 234, 0.4);
        }

        /* Radio Buttons */
        .gender-options {
            display: flex;

            gap: 25px;

            padding-top: 10px;
        }

        .gender-options label {
            display: flex;

            align-items: center;

            gap: 7px;

            font-weight: normal;
        }

        .gender-options input {
            width: auto;
        }

        /* Address */
        textarea {
            height: 100px;

            resize: vertical;
        }

        /* Buttons */
        .buttons {
            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 30px;
        }

        button {
            padding: 13px 35px;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        /* Register Button */
        .register-btn {
            background: #667eea;

            color: white;
        }

        .register-btn:hover {
            background: #4c5fd5;

            transform: translateY(-2px);
        }

        /* Reset Button */
        .reset-btn {
            background: #e0e0e0;

            color: #333;
        }

        .reset-btn:hover {
            background: #c7c7c7;
        }

        /* Required Star */
        .required {
            color: red;
        }

        /* Mobile Responsive */
        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .container {
                width: 100%;

                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;

                gap: 15px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

    </style>

</head>
